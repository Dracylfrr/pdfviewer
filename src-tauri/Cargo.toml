[package]
name = "pdfviewer"
version = "0.3.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
notify = "8"
sha2 = "0.10"
tauri-plugin-updater = "2.13"
serde_json = "1"

tempfile = "3"
